  name: Felipe Toscano
  links:
    - "https://github.com/felipetac"
    - "https://www.linkedin.com/in/felipetac"

# jekyll-seo-tag: logo (JSON-LD Organization/publisher)
logo: /assets/img/blog-author.webp

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

# Plugins
plugins:
  - jemoji
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Links to include in menu navigation
# For external links add external: true
links:
  - title: Home
    url: /
  - title: Sobre Mim
    url: https://www.linkedin.com/in/felipetac
    external: true
#  - title: Sobre Mim
#    url: /sobre-mim/
  - title: Contato
    url: /contato/

# Exclude my node related stuff
# CLAUDE.md/README.md ficam de fora porque não têm front-matter: em builds que usam o plugin
# jekyll-optional-front-matter (caso do build legado do GitHub Pages, via gem github-pages),
# arquivos .md sem front-matter ainda são tratados como páginas e passam pelo Liquid — como
# CLAUDE.md cita `{% if %}` como texto (documentando um trecho de bd.html/dev.html), isso já
# quebrou o build com "Liquid syntax error: 'if' tag was never closed".
exclude: ['package.json', 'package-lock.json', 'gulpfile.mjs', 'src', 'node_modules', 'CLAUDE.md', 'README.md', 'initpost.sh', 'initdraft.sh']
