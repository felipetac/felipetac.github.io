# Social Media
# Remove the item if you don't need it
github_username: felipetac
#facebook_username: facebook_username
#twitter_username: felipe_tac
#instagram_username: instagram_username
linkedin_username: felipetac
#medium_username: medium_username

# jekyll-seo-tag: usado no JSON-LD "sameAs" (perfis oficiais)
